# Render Blueprint - deploys Postgres + ChuoAI backend + frontend from this repo.
#
# How to use:
#   1. Commit + push this file to GitHub.
#   2. dashboard.render.com -> New -> Blueprint -> connect the ChuoAI repo.
#   3. Review -> Apply. Render creates the database first, then backend, then frontend.
#      You will be asked to paste GROQ_API_KEY and NEXT_PUBLIC_API_URL when applying.

databases:
  - name: chuoai-db                # database instance name in Render
    databaseName: chuoai           # actual DB name inside Postgres
    user: chuoai                   # DB role
    plan: starter                  # starter | standard | pro
    region: frankfurt              # oregon | ohio | virginia | singapore | frankfurt
    postgresEngineVersion: "16.1"
    # block external/internet access; only Render services can reach it
    ipAllowList: []

services:
  - type: web
    name: chuoai-backend
    rootDir: backend
    runtime: python
    plan: starter                  # starter | standard | pro (free sleeps, kills streams)
    region: frankfurt              # keep same region as the database
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    preDeployCommand: python scripts/init_db.py
    healthCheckPath: /health
    autoDeploy: true
    numInstances: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chuoai-db
          property: connectionString   # Render injects the internal DB URL automatically
      - key: SECRET_KEY
        generateValue: true            # random 32+ char secret generated by Render
      - key: JWT_SECRET
        generateValue: true            # random separate secret
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        value: '["http://localhost:3000"]'   # *.onrender.com + *.vercel.app allowed via regex in main.py
      - key: GROQ_API_KEY
        sync: false                    # you will paste your key when pressing Apply
      - key: OPENAI_API_KEY
        sync: false                    # optional - for embeddings/vector RAG later

  - type: web
    name: chuoai-frontend
    rootDir: frontend
    runtime: node
    plan: starter
    region: frankfurt                 # keep same region as backend + database
    buildCommand: npm install && npm run build
    startCommand: npx next start -p $PORT
    healthCheckPath: /
    autoDeploy: true
    numInstances: 1
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false                    # paste your backend URL + /api, e.g. https://chuoai-backend-xxxx.onrender.com/api