# Render Blueprint - deploys Postgres + ChuoAI backend from this repo.
# Frontend stays on Vercel (Next.js), pointed at the backend URL below.
#
# How to use:
#   1. Commit + push this file to GitHub.
#   2. dashboard.render.com -> New -> Blueprint -> connect the ChuoAI repo.
#   3. Review -> Apply. Render creates the database first, then the backend.

databases:
  - name: chuoai-db                # database instance name in Render
    databaseName: chuoai           # actual DB name inside Postgres
    user: chuoai                   # DB role
    plan: starter                  # starter | standard | pro
    region: frankfurt              # oregon | ohio | virginia | singapore | frankfurt
    postgresEngineVersion: "16.1"
    # block external/internet access; only Render services can reach it
    ipAllowList: []

services:
  - type: web
    name: chuoai-backend
    rootDir: backend
    runtime: python
    plan: starter                  # starter | standard | pro (free sleeps, kills streams)
    region: frankfurt              # keep same region as the database
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    preDeployCommand: python scripts/init_db.py
    healthCheckPath: /health
    autoDeploy: true
    numInstances: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chuoai-db
          property: connectionString   # Render injects the internal DB URL automatically
      - key: SECRET_KEY
        generateValue: true            # random 32+ char secret generated by Render
      - key: JWT_SECRET
        generateValue: true            # random separate secret
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        value: '["https://chuo-ai.vercel.app","http://localhost:3000"]'
      - key: GROQ_API_KEY
        sync: false                    # you will paste your key when pressing Apply
      - key: OPENAI_API_KEY
        sync: false                    # optional - for embeddings/vector RAG later